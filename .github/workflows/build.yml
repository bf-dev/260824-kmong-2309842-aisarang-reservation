name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: unit tests
        run: python -m pytest tests/ -q

      # 실물 캡처 회귀 테스트를 이름을 드러내서 한 번 더 돌린다. 이 파일들은
      # 고객이 자기 공동인증서 세션에서 받은 진짜 응답에 대고 선택자를
      # 돌린다(진짜 크롬). 여기가 빨간불이면 4~9단계가 깨진 것이다.
      - name: real captured markup regression (real Chromium)
        run: python -m pytest tests/test_real_capture.py tests/test_real_markup.py -v

      # v1.0.8 의 핵심. 인계 모드를 **고객 캡처 실물**에 대고 진짜 크롬으로
      # 돌린다. 사람이 만든 설정에서는 발사하고, 확인창이 없거나 대기열이거나
      # 체크가 꺼져 있으면 발사하지 않는다는 것을 여기서 증명한다.
      # netfunnel_waiting.html 은 2026-08-26 08:57 고객 PC 캡처의 진짜 대기열
      # 레이어다(고객이 그날 예약을 놓친 화면).
      - name: handover mode fires only on a real human-made setup (real Chromium)
        run: python -m pytest tests/test_handover.py -v

      # 셀렉터 의존성 전수 감사. 미확인이 늘거나 제품 동작 검증이 하나라도
      # 깨지면 0 이 아닌 코드로 끝나 빌드를 세운다.
      - name: selector dependency audit
        run: python ci/selector_audit.py --verbose

      # v1.0.5 부터 --onedir 이다. --onefile 은 실행할 때마다 자기 자신을
      # %TEMP% 에 풀어놓고, 윈도우 디펜더가 그 동작을 오탐해 고객 PC 에서
      # 파일을 막아버렸다("지정한 장치, 경로 또는 파일에 액세스할 수 없습니다").
      # 폴더 배포는 푸는 동작이 없다. 버전 리소스와 아이콘도 같이 박는다
      # (메타데이터가 전혀 없는 exe 는 그 자체로 평판 점수가 깎인다).
      - name: build (onedir)
        run: >
          pyinstaller --onedir --noconsole
          --name aisarang-reservation
          --version-file ci/version_info.txt
          --icon ci/app.ico
          --collect-all selenium
          --hidden-import tkinter
          --noconfirm
          main.py

      - name: exe exists and is a real PE
        shell: pwsh
        run: |
          $exe = Get-Item dist\aisarang-reservation\aisarang-reservation.exe
          if (-not $exe) { throw "no exe" }
          "{0}  {1:N1} MB" -f $exe.Name, ($exe.Length / 1MB)
          $fs = [System.IO.File]::OpenRead($exe.FullName)
          $b = New-Object byte[] 2; $fs.Read($b, 0, 2) | Out-Null; $fs.Close()
          if ($b[0] -ne 0x4D -or $b[1] -ne 0x5A) { throw "not a PE binary" }
          "PE header OK (MZ)"
          $vi = (Get-Item $exe.FullName).VersionInfo
          "version resource: $($vi.ProductName) / $($vi.FileVersion)"
          if (-not $vi.FileVersion) { throw "version resource missing" }
          if (-not (Test-Path dist\aisarang-reservation\_internal)) { throw "_internal missing" }

      - name: package zip
        run: python ci/package_zip.py dist/aisarang-reservation out

      # 디펜더 정의를 최신으로 올린 뒤 실제 엔진으로 스캔한다. 고객에게 보낼
      # 바이트를 스캔하지 않고 올리는 일은 없다.
      - name: update Defender signatures
        continue-on-error: true
        shell: pwsh
        run: |
          & "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -SignatureUpdate
          "signature update exit: $LASTEXITCODE"
          $s = Get-MpComputerStatus
          "AMEngineVersion          : $($s.AMEngineVersion)"
          "AntivirusSignatureVersion: $($s.AntivirusSignatureVersion)"
          "SignatureLastUpdated     : $($s.AntivirusSignatureLastUpdated)"
          "RealTimeProtectionEnabled: $($s.RealTimeProtectionEnabled)"
          "AntivirusEnabled         : $($s.AntivirusEnabled)"

      # 진단: 고객이 실제로 받은 v1.0.4 (--onefile) 바이트를 같은 엔진으로 스캔한다.
      # 결과가 무엇이든 빌드를 세우지 않는다. 판정을 기록하는 것이 목적이다.
      - name: diagnose the shipped v1.0.4 onefile exe
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path diag | Out-Null
          Invoke-WebRequest -Uri "https://works.insu.ng/works/public/2309842/aisarang-reservation-1.0.4.exe" -OutFile diag\v104.exe
          $h = (Get-FileHash diag\v104.exe -Algorithm SHA256).Hash.ToLower()
          "downloaded v1.0.4: $((Get-Item diag\v104.exe).Length) bytes sha256=$h"
          powershell -ExecutionPolicy Bypass -File ci\defender_scan.ps1 -Path diag\v104.exe -Label "v1.0.4-onefile"

      - name: Defender scan of the onedir build
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File ci\defender_scan.ps1 -Path dist\aisarang-reservation -Label "v1.0.12-onedir" -MustBeClean

      - name: Defender scan of the delivered zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem out\*.zip | Select-Object -First 1
          powershell -ExecutionPolicy Bypass -File ci\defender_scan.ps1 -Path $zip.FullName -Label "v1.0.12-zip" -MustBeClean

      # 러너에서 대상 사이트에 닿는지 먼저 본다. 여기가 막히면 exe 문제가 아니라
      # 망 문제이므로, 아래 selftest 는 실패로 치지 않고 fixture 로 검증한다.
      - name: probe childcare.go.kr from the runner
        id: probe
        continue-on-error: true
        run: python ci/probe.py

      - name: runtime selftest against the live site (only if reachable)
        if: steps.probe.outcome == 'success'
        shell: pwsh
        run: |
          $p = Start-Process dist\aisarang-reservation\aisarang-reservation.exe -ArgumentList "--selftest" -PassThru -Wait
          "selftest exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "live selftest failed" }

      # 러너에서 대상 사이트가 막혀도 exe 의 전체 파이프라인(Date 헤더 동기화,
      # 기관 목록 파싱, 진단 업로드)은 진짜로 돌려서 확인해야 한다.
      # 실제로 녹화한 응답을 로컬 서버로 되먹여 프로즌 exe 를 통과시킨다.
      - name: runtime selftest against recorded fixtures (always)
        shell: pwsh
        run: |
          $srv = Start-Process python -ArgumentList "ci\fixture_server.py","18642" -PassThru
          $ready = $false
          foreach ($i in 1..60) {
            try {
              $tc = Test-NetConnection -ComputerName 127.0.0.1 -Port 18642 -InformationLevel Quiet -WarningAction SilentlyContinue
              if ($tc) { $ready = $true; break }
            } catch { }
            Start-Sleep -Milliseconds 500
          }
          if (-not $ready) { throw "fixture server did not come up on 18642" }
          "fixture server ready on 18642"
          try {
            $env:AISARANG_BASE_URL = "http://127.0.0.1:18642"
            $p = Start-Process dist\aisarang-reservation\aisarang-reservation.exe -ArgumentList "--selftest" -PassThru -Wait
            "fixture selftest exit code: $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { throw "fixture selftest failed" }
          } finally {
            Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
          }

      - name: GUI construct selftest
        shell: pwsh
        run: |
          $p = Start-Process dist\aisarang-reservation\aisarang-reservation.exe -ArgumentList "--guiselftest" -PassThru -Wait
          "gui construct exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "gui construct failed" }

      # 고객이 실제로 하는 것과 같은 경로로 한 번 더 확인한다: ZIP 을 풀어서
      # 그 폴더의 exe 를 실행한다. 폴더 배포가 옮겨져도 도는지 여기서 걸린다.
      - name: run the exe extracted from the delivered zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem out\*.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath unzipped -Force
          $exe = Get-ChildItem unzipped -Recurse -Filter aisarang-reservation.exe | Select-Object -First 1
          "extracted exe: $($exe.FullName)"
          $srv = Start-Process python -ArgumentList "ci\fixture_server.py","18643" -PassThru
          $ready = $false
          foreach ($i in 1..60) {
            try {
              $tc = Test-NetConnection -ComputerName 127.0.0.1 -Port 18643 -InformationLevel Quiet -WarningAction SilentlyContinue
              if ($tc) { $ready = $true; break }
            } catch { }
            Start-Sleep -Milliseconds 500
          }
          if (-not $ready) { throw "fixture server did not come up on 18643" }
          "fixture server ready on 18643"
          try {
            $env:AISARANG_BASE_URL = "http://127.0.0.1:18643"
            $p = Start-Process $exe.FullName -ArgumentList "--selftest" -PassThru -Wait
            "extracted-zip selftest exit code: $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { throw "extracted zip selftest failed" }
          } finally {
            Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
          }

      # 자동 업데이트의 '교체' 를 진짜로 실행해 본다.
      #
      # 2026-09-02 사고의 회귀 시험이다. 그날 고객은 "새 버전을 받았습니다 곧
      # 자동으로 재시작합니다" 를 본 뒤 프로그램이 꺼지고 다시 오지 않는 것을
      # 반복해서 겪었고, 원인은 교체 배치 안의 파이프(`tasklist | find`) 였다.
      # 콘솔 없는 DETACHED_PROCESS 에서 cmd 는 파이프를 만들지 못하고 배치가
      # 그 줄에서 통째로 중단된다. robocopy 도 재실행도 도달하지 못했다.
      #
      # 그때까지 이 저장소의 업데이터 시험은 전부 순수 함수만 봤고, 교체 배치는
      # CI 에서 **한 번도 실행된 적이 없었다.** 그래서 CI 가 계속 초록이었다.
      # 한글 경로 사례도 같이 돈다(고객은 한국어 윈도우를 쓴다).
      - name: auto-update swap actually applies (real batch, real robocopy)
        shell: pwsh
        run: |
          python ci\swap_check.py dist\aisarang-reservation
          if ($LASTEXITCODE -ne 0) { throw "auto-update swap check failed" }

      # v1.0.6 의 핵심 약속: 서버 시각을 한 번 재고 마는 게 아니라 프로그램이
      # 도는 내내 다시 잰다(제품 주기 5분). 그 말이 사실인지 프로즌 exe 로
      # 실제로 돌려서 본다. CI 시간을 아끼려고 주기만 20초로 줄여 부르지만,
      # 도는 코드는 09시까지 실제로 도는 바로 그 ClockKeeper 다.
      - name: periodic clock re-sync actually runs (frozen exe)
        shell: pwsh
        run: |
          $srv = Start-Process python -ArgumentList "ci\fixture_server.py","18644" -PassThru
          $ready = $false
          foreach ($i in 1..60) {
            try {
              $tc = Test-NetConnection -ComputerName 127.0.0.1 -Port 18644 -InformationLevel Quiet -WarningAction SilentlyContinue
              if ($tc) { $ready = $true; break }
            } catch { }
            Start-Sleep -Milliseconds 500
          }
          if (-not $ready) { throw "fixture server did not come up on 18644" }
          "fixture server ready on 18644"
          try {
            $env:AISARANG_BASE_URL = "http://127.0.0.1:18644"
            $log = "clocktest.log"
            $p = Start-Process dist\aisarang-reservation\aisarang-reservation.exe `
                 -ArgumentList "--clocktest=1.2","--interval=20" `
                 -RedirectStandardOutput $log -PassThru -Wait
            Get-Content $log
            "clocktest exit code: $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { throw "periodic clock re-sync did not run" }
            $n = ([regex]::Matches((Get-Content $log -Raw), "RESYNC n=")).Count
            "re-measurement log lines: $n"
            if ($n -lt 3) { throw "expected at least 3 re-measurements, got $n" }
            # v1.0.10: 출하되는 경로는 밀리초 서버시각이다. Date 헤더 폴백으로
            # 조용히 되돌아가면 시각 오차가 다시 수백 ms 로 벌어진다.
            $ms = ([regex]::Matches((Get-Content $log -Raw), "resolution=ms")).Count
            "millisecond-clock re-measurements: $ms"
            if ($ms -lt 3) { throw "the shipped path is the ms server clock, got $ms" }
          } finally {
            Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
          }

      # v1.0.6 의 다른 약속: 진단 기록 모드는 **아무것도 누르지 않는다**.
      # 프로즌 exe 로 진짜 크롬을 띄워, 사람이 누르는 것만 기록되는지,
      # 우리가 못 봤던 ajax 응답 본문이 실제로 남는지, 그리고 예약 계기가
      # 끝까지 꺼져 있는지(window.__reserved === false) 확인한다.
      - name: diagnostic recorder records but never clicks (frozen exe)
        shell: pwsh
        run: |
          $srv = Start-Process python -ArgumentList "ci\fixture_server.py","18645" -PassThru
          $ready = $false
          foreach ($i in 1..60) {
            try {
              $tc = Test-NetConnection -ComputerName 127.0.0.1 -Port 18645 -InformationLevel Quiet -WarningAction SilentlyContinue
              if ($tc) { $ready = $true; break }
            } catch { }
            Start-Sleep -Milliseconds 500
          }
          if (-not $ready) { throw "fixture server did not come up on 18645" }
          "fixture server ready on 18645"
          try {
            $env:AISARANG_BASE_URL = "http://127.0.0.1:18645"
            $log = "rectest.log"
            $p = Start-Process dist\aisarang-reservation\aisarang-reservation.exe `
                 -ArgumentList "--rectest" `
                 -RedirectStandardOutput $log -PassThru -Wait
            Get-Content $log
            "rectest exit code: $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { throw "diagnostic recorder run failed" }
            $raw = Get-Content $log -Raw
            if ($raw -notmatch "reserved=False") { throw "the recorder reached the reserve callback" }
            if ($raw -notmatch "SelectOccasionChild.html") { throw "child ajax body not recorded" }
            if ($raw -notmatch "OccasionTimeMainSlPL.html") { throw "useinfo ajax body not recorded" }
          } finally {
            Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
          }

      # 인계 모드를 **프로즌 exe** 로 실물 캡처에 대고 한 번 더 돌린다.
      # 단위 테스트가 아니라 고객이 받는 그 바이트가 그렇게 동작하는지 본다.
      # 실사이트에는 가지 않는다(로컬 http 픽스처 전용).
      - name: handover mode on the frozen exe (real captured markup)
        shell: pwsh
        run: |
          $log = "handovertest.log"
          $dir = Join-Path (Get-Location) "ci\fixtures\real"
          $p = Start-Process dist\aisarang-reservation\aisarang-reservation.exe `
               -ArgumentList "--handovertest=$dir" `
               -RedirectStandardOutput $log -PassThru -Wait
          Get-Content $log
          "handovertest exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "handover mode check failed" }
          $raw = Get-Content $log -Raw
          if ($raw -notmatch "HANDOVERTEST fired=1/6 expected=1") { throw "expected exactly one fire" }
          if ($raw -notmatch "netfunnel_waiting.html.*queue=True.*ready=False.*fired=False") {
            throw "the real queue page must never fire"
          }
          if ($raw -notmatch "queueAhead=72 queueBehind=26") {
            throw "the captured queue numbers were not read back"
          }
          if ($raw -notmatch "modal_open.html ticked=True.*ready=True fired=True") {
            throw "a human-made setup must actually fire"
          }
          if ($raw -notmatch "modal_open.html ticked=False.*ready=False fired=False") {
            throw "an unticked row must never fire"
          }
          # v1.0.9: 2026-08-27 09:00:00 의 실물 '예약시간전' 화면.
          # 서버 원문이 too_early 로 읽히고, 되살리기가 [예약하기] 하나와
          # 알림 [확인] 하나만 누르고, 예약 확인창은 0회여야 한다.
          if ($raw -notmatch "too_early_alert.html ticked=True.*ready=False fired=False") {
            throw "the too-early screen has no dialog to fire at"
          }
          if ($raw -notmatch "tooEarlyText=too_early reopenAllowed=True fnSave=1 alertClosed=1 confirmClicked=0") {
            throw "the too-early recovery did not press exactly the reserve button once"
          }
          # v1.0.10: 2026-09-01 09:00:00 의 실물 '선예약' 화면 (자리를 뺏긴 응답).
          # taken 으로 읽혀야 하고, 되살리기 문은 절대 열리면 안 된다
          # (다시 [예약하기] 를 누르면 가상대기열 맨 뒤로 간다 - 2026-08-26).
          if ($raw -notmatch "taken_alert.html ticked=True.*ready=False fired=False") {
            throw "the taken screen has no dialog to fire at"
          }
          if ($raw -notmatch "takenText=taken reopenAllowed=False fnSave=0 alertClosed=0 confirmClicked=0") {
            throw "a taken slot must not re-press the reserve button"
          }
          # v1.0.12: 2026-09-04 09:00:00 의 실패를 그대로 재현한다. 화면에는
          # 안내가 하나도 없고(screenNotices=0), 예약 제출의 응답만 화면 판정
          # 창(1.6초)보다 늦게 온다. 그날 로그는 "(문구 없음) [unknown]" 이었다.
          # 이제는 응답 본문으로 taken 이 나와야 하고, 그 문구는 서버 원문
          # (2026-09-04 캡처의 returnmsg) 그대로여야 한다.
          if ($raw -notmatch "submitCode=taken submitSource=submit submitStatus=200 screenNotices=0 verbatim=True") {
            throw "the submit response body did not reach the classifier"
          }
          # 응답을 끝까지 기다렸다는 증거. 여기가 깨지면 09-04 로 되돌아간 것이다.
          $m = [regex]::Match($raw, "submitWaitedMs=([\d.]+) screenWindowMs=([\d.]+)")
          if (-not $m.Success) { throw "no submit wait measurement in the log" }
          "submit waited $($m.Groups[1].Value) ms, screen window $($m.Groups[2].Value) ms"
          if ([double]$m.Groups[1].Value -le [double]$m.Groups[2].Value) {
            throw "the classifier gave up before the submit response arrived"
          }
          # 훅이 고객 페이지를 망가뜨리지 않는다: 사이트 자신의 핸들러도 같은
          # JSON 을 받고, 엄격 모드의 맨몸 fetch(...) 가 살아 있다.
          # (`_fetch.apply(this, ...)` 로 되돌리면 여기서 Illegal invocation 이 난다.)
          if ($raw -notmatch "pageStillGotJson=True fetchStatus=200 fetchError=- staleIgnored=True") {
            throw "the net hook broke the page, or a stale response was reused"
          }

      - name: GUI screenshot (real window, real result on screen)
        shell: pwsh
        run: |
          $srv = $null
          if ("${{ steps.probe.outcome }}" -ne "success") {
            $srv = Start-Process python -ArgumentList "ci\fixture_server.py","18642" -PassThru
            foreach ($i in 1..60) {
              if (Test-NetConnection -ComputerName 127.0.0.1 -Port 18642 -InformationLevel Quiet -WarningAction SilentlyContinue) { break }
              Start-Sleep -Milliseconds 500
            }
            $env:AISARANG_BASE_URL = "http://127.0.0.1:18642"
            Write-Host "live site blocked from runner: filling the UI from recorded real responses"
          }
          try {
            powershell -ExecutionPolicy Bypass -File ci\gui_screenshot.ps1
            # 두 번째 컷: 설정 영역을 끝까지 내려 새로 붙은 [진단 기록 시작] /
            # [기록 중지] 버튼이 실제로 창에 있다는 것을 픽셀로 남긴다.
            powershell -ExecutionPolicy Bypass -File ci\gui_screenshot.ps1 `
              -DemoArgs "--guidemo,--showrecord,--hold=90000" `
              -Out "gui-record.png" -SettleSeconds 20
            # 세 번째 컷: 인계 모드 상태판이 '확인창 감지됨 / 선택표 체크 켜짐'
            # 으로 켜진 순간. 고객이 9시 직전에 보게 되는 바로 그 화면이다.
            powershell -ExecutionPolicy Bypass -File ci\gui_screenshot.ps1 `
              -DemoArgs "--guidemo,--hold=200000" `
              -Out "gui-handover.png" -SettleSeconds 110
          } finally {
            if ($srv) { Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: sha256 of the delivered zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem out\*.zip | Select-Object -First 1
          $h = Get-FileHash $zip.FullName -Algorithm SHA256
          "{0}  {1}  {2} bytes" -f $h.Hash.ToLower(), $zip.Name, $zip.Length

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aisarang-reservation
          path: |
            out/*.zip
            screenshots/*.png
          retention-days: 14
