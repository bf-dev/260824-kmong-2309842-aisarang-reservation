<script>
//debugger;
$(document).ready(function() {
	$('#emTotCnt').html("1");
	
	$('.srcboard-list ul li .detail a').click(function() {
		$('.srcboard-list ul li .detail ul').removeClass('active');
		$('.srcboard-list ul li .detail a').removeClass('active').attr('aria-label','내용열기');
				
		var clickElement = $(this).next();
		if (clickElement.is('.srcboard-list ul li .detail ul')) {
		    if (clickElement.is(':visible')) {
				clickElement.slideUp();
			} else {
				$('.srcboard-list ul li .detail ul').slideUp();
				clickElement.slideDown();
				$(this).closest('a').addClass('active').attr('aria-label','내용닫기');
			}
		}
	});
	
	$('[id^=infoMove]').click(function () {
		let dataVal = $(this).data().val;
		goInfoMove(dataVal);
	});
	
	$('[id^=viwMap]').click(function() {
		let dataVal = $(this).data().val;
		fnViewMap(dataVal);
	});
	
	$('[id^=viewOper]').click(function() {
		let dataVal = $(this).data().val;
		customAjax.ajax({
	        type: "POST",
	        url: "/icms/nursery/TmpCareOperView.html",
	        data: {
	        	stcode: dataVal
	        },
	        success: function(data) {
	        	$("#pop-up-popup").empty();
	        	$("#pop-up-popup").append(data);
	        	$("#pop-up-popup").show();
	        }
	    });
	});
	$('[id^=occasionRes]').click(function () {
		let dataStcode = $(this).data().stcode;
		let dataUnityyn = $(this).data().unityyn;
		let dataUnityynall = $(this).data().unityynall;
		gotoOccasionRes(dataStcode, dataUnityyn, dataUnityynall);
	});
	
    $('.result_btn_group .btn_more').click(function(e) {
        //e.preventDefault();
        var $this = $(this);
        
        // 버튼 위나 아래에 있는 result_detail을 찾음
        var $currentDetail = $this.closest('.result_btn_group').prev('.result_detail').length ?
                            $this.closest('.result_btn_group').prev('.result_detail') :
                            $this.closest('.result_btn_group').next('.result_detail');
        
        // 현재 열려 있는 모든 result_detail을 닫고, 모든 버튼에서 'on' 클래스 제거
        $('.result_detail').not($currentDetail).slideUp(200);
        $('.result_btn_group .btn_more').not($this).removeClass('on').attr('title', '어린이집 추가 상세 정보 열기');
        
        // 클릭한 버튼에 대응하는 result_detail 열기/닫기
        $currentDetail.slideToggle(200);
        $this.toggleClass('on');
        
        // title 속성 토글
        if ($this.hasClass('on')) {
            $this.attr('title', '어린이집 추가 상세 정보 닫기');
        } else {
            $this.attr('title', '어린이집 추가 상세 정보 열기');
        }
        return false;
    });
	
});

function goInfoMove(stcode){
	let serverType = "P";
	let infoSrc = "https://info.childcare.go.kr/info/pnis/search/preview/SummaryInfoSlPu.jsp?flag=YJ&STCODE_POP="+stcode ;
	window.open(infoSrc,"어린이집찾기","width=1100,height=850,scrollbars=1,resizable=yes");
}

let fnViewMap = function (stcode){
	let serverType = "P";
    var mapPop = window.open('about:blank', 'mapPop','width=770,height=600,scrollbars=no,resizable=no');
    var frm = document.mfrm;
    frm.crname_map.value = $('#pagingForm #crname').val(); // 어린이집 이름
    frm.ctprvn_map.value = $('#pagingForm #ctprvn').val();  //  시도
    frm.signgu_map.value = $('#pagingForm #signgu').val(); // 구군
    var infoSrc = "https://info.childcare.go.kr/info/pnis/search/MapSlL.jsp?popGb=popMap&STCODE=" + stcode;
	if (serverType != "P") {
		infoSrc = "https://stzinfo.childcare.go.kr/info/pnis/search/MapSlL.jsp?popGb=popMap&STCODE=" + stcode;
	}
    frm.action = infoSrc;
    frm.target = 'mapPop';
    frm.submit();
    mapPop.focus();
}
